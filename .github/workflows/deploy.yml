name: CI-CD Pipeline

on:
   push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v3

     - name: Setup Python
       uses: actions/setup-python@v4
       with:
         python-version: '3.10'

     - name: Install dependencies
       run:  >
         pip install pandas azure-storage-blo

     - name: Check Python syntax
       run: >
         python -m py_compile process_function.py

     - name: BUild Docker image
       run: >
         docker build -t diet-analysis .
